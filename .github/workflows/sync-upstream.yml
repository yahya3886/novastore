name: Sync upstream apps

on:
  schedule:
    - cron: "17 6 * * 1" # haftalık kontrol (deploy-repo da upstream senkronize eder)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Upstream APK'lar git'te tutulmaz; tools/sync-upstream.py deploy sırasında
# (ve haftalık deploy-repo zamanlamasıyla) en güncel sürümleri indirir.
# Bu workflow, depoyu isteğe bağlı olarak hemen yenileyip güncellemeleri
# yayınlamak için deploy-repo'yu tetikler.
jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Depo yeniden dağıtımını tetikle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-repo.yml --ref main
