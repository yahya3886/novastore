name: Deploy repo (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'apks/**'
      - 'meta/**'
      - 'icons/**'
      - 'shots/**'
      - 'tools/mkindex.py'
      - '.github/workflows/deploy-repo.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Android build-tools (aapt2)
        uses: android-actions/setup-android@v3
        with:
          packages: build-tools;36.0.0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Depo indeksini üret
        run: |
          python3 tools/mkindex.py \
            --apk-dir ./apks \
            --meta-dir ./meta \
            --icon-dir ./icons \
            --shots-dir ./shots \
            --out ./site/repo \
            --address https://yahya3886.github.io/novastore/repo \
            --name "NovaStore Deposu" \
            --description "NovaStore uygulamaları"

      - name: GitHub Pages yapılandır
        uses: actions/configure-pages@v5

      - name: Yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Yayınla
        id: deployment
        uses: actions/deploy-pages@v4
